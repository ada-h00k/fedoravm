name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Linux x86_64 release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check

      - name: Build release binary
        run: cargo build --release

      - name: Package release
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          sha="$(git rev-parse --short=12 HEAD)"
          archive="vmforge-linux-x86_64.tar.gz"
          checksum="${archive}.sha256"

          mkdir -p dist
          cp target/release/vmforge dist/vmforge

          tar -C dist -czf "dist/${archive}" vmforge
          sha256sum "dist/${archive}" > "dist/${checksum}"

          tag="build-${version}-${GITHUB_RUN_NUMBER}-${sha}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${checksum}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: vmforge ${{ steps.package.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          body: |
            Automated build for commit `${{ github.sha }}`.

            This is a continuous build and is published as a pre-release.
            Download `vmforge-linux-x86_64.tar.gz` for Linux x86_64.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
