[package]
name = "vmforge"
version = "0.4.4"
edition = "2021"
description = "Small QEMU/KVM VM manager for Linux distributions"
license = "AGPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
libc = "0.2"
